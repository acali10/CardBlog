<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cartão de Blog</title>
    <link rel="shortcut icon" href="assets/favicon-32x32.png" type="image/x-icon">
</head>

<body>
    <main>
        <div class="container">

            <div class="card">
                <img src="assets/illustration-article.svg" alt="Imagem de figuras vetoriais">

                <div class="learn">
                    <p>Learning</p>
                </div>

                <div class="published">
                    <p>Published 21 Dec 2023</p>
                </div>

                <div class="textos">
                    <h1>HTML & CSS foundations</h1>
                    <p>These languages are the backbone of every website, defining structure, content, and presentation.
                    </p>
                </div>

                <div class="perfil">
                    <img src="assets/image-avatar.webp" alt="Imagem de homem branco olhando para o lado">
                    <p>Greg Hooper</p>
                </div>
            </div>

        </div>

    </main>
    
            <footer>
            Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
            Coded by <a href="https://github.com/acali10/CardBlog">Caline Nepomoceno</a>.
        </footer>
</body>

</html>
